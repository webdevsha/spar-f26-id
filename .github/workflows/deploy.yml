name: deploy-dashboard
# Build dist/index.html from data/*.csv and deploy to Cloudflare Pages.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "build/build_dashboard.py"
      - "functions/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        run: python build/build_dashboard.py

      # Persist standalone reports that live outside index.html into the
      # deploy folder so their exact URLs (e.g. /build/spar-id-postings.html)
      # survive on the live site. Mirrors the local deploy.sh step.
      - name: Stage standalone reports
        run: |
          mkdir -p dist/build
          for f in build/*.html; do
            [ -f "$f" ] || continue
            cp "$f" "dist/build/$(basename "$f")"
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name spar-f26-id --branch main