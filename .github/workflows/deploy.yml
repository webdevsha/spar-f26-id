name: deploy-dashboard
# Build dist/index.html from data/*.csv and deploy to Cloudflare Pages.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "app/**"
      - "build/build_dashboard.py"
      - "build/*.html"
      - "build/*.json"
      - "functions/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        run: python build/build_dashboard.py

      # Persist standalone reports that live outside index.html into the
      # deploy folder so their exact URLs (e.g. /build/spar-id-postings.html)
      # survive on the live site. Mirrors the local deploy.sh step.
      - name: Stage standalone reports
        run: |
          mkdir -p dist/build
          for f in build/*.html; do
            [ -f "$f" ] || continue
            cp "$f" "dist/build/$(basename "$f")"
          done
          # Data files the standalone pages fetch at runtime (e.g. the live
          # intake status). Without this they are not deployed, and a request
          # under /build/ falls through to the middleware fallback -- which
          # returns an HTML page with a 200, breaking any JSON fetch.
          for f in build/*.json; do
            [ -f "$f" ] || continue
            cp "$f" "dist/build/$(basename "$f")"
          done

      - name: Stage the app as the site root
        # app/ is the public face: app/index.html becomes the home page. The
        # generated dashboard is kept (not deleted) at /dashboard.html so this
        # mirrors deploy.sh exactly — a CI run must never revert the root.
        run: |
          if [ -f dist/index.html ]; then mv dist/index.html dist/dashboard.html; fi
          cp app/*.html app/*.js app/*.json dist/
          if [ -d app/files ]; then
            mkdir -p dist/files
            cp -R app/files/. dist/files/
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name spar-f26-id --branch main